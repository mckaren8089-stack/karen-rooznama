name: Validate Rooznama
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/check-release.mjs
      - run: node --check app.js
      - run: node --check core.mjs
      - run: node --check events.mjs
      - run: node --check notes.mjs
      - run: node --check notes-store.mjs
      - run: node --check scripts/check-official-source.mjs
      - run: node --check sw.js
      - run: node --test tests/*.test.mjs
