name: Validate Rooznama
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/check-release.mjs
      - run: node --check app.js
      - run: node --check core.mjs
      - run: node --check events.mjs
      - run: node --check notes.mjs
      - run: node --check notes-store.mjs
      - run: node --check tasks.mjs
      - run: node --check tasks-store.mjs
      - run: node --check scripts/check-official-source.mjs
      - run: node --check sw.js
      - run: node --test tests/*.test.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Generate install icons for offline browser test
        run: |
          python -m pip install --disable-pip-version-check 'cairosvg==2.8.2' 'pillow==11.3.0'
          python scripts/build-pwa-icons.py
      - name: Install pinned browser test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test UI, local data and offline shell
        env:
          UI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          UI_OUTPUT_DIR: /tmp/rooznama-ui
        run: node scripts/test-ui.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rooznama-ui-screenshots
          path: /tmp/rooznama-ui/*.png
          retention-days: 14
