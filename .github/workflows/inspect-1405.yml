name: Inspect official 1405 calendar PDF text layout
on:
  push:
    paths:
      - 'scripts/inspect-calendar-1405.mjs'
      - '.github/workflows/inspect-1405.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF text extraction
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Inspect layout with pdftotext
        run: node scripts/inspect-calendar-1405.mjs
      - name: Group occasion cells by day
        run: node scripts/probe-rows-1405.mjs
