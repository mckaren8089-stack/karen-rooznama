name: Deploy Rooznama to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify release contract
        run: node scripts/check-release.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Generate Android PWA icons
        run: |
          python -m pip install --disable-pip-version-check 'cairosvg==2.8.2' 'pillow==11.3.0'
          python scripts/build-pwa-icons.py
          python - <<'PY'
          from PIL import Image
          for size in (192,512):
              image=Image.open(f"icons/faravahar-{size}.png")
              assert image.format=="PNG" and image.size==(size,size)
          assert Image.open("icons/faravahar-maskable-512.png").size==(512,512)
          PY
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
