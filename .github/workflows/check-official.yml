name: Check official calendar source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-official.yml'
      - 'data/years/**'
      - 'scripts/check-official-source.mjs'
  workflow_dispatch:
  schedule:
    - cron: '23 9 10 * *'
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Probe Tehran University calendar PDF (no unreviewed imports)
        run: node scripts/check-official-source.mjs
