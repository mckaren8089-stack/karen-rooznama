name: PWA read-only live diagnostics
on:
  pull_request:
    paths:
      - 'docs/workflow/pwa_live_probe.py'
      - '.github/workflows/pwa-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check published files (read-only)
        run: python docs/workflow/pwa_live_probe.py
