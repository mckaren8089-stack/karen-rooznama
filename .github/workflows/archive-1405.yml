name: Archive reviewed 1405 source data
on:
  push:
    paths:
      - '.github/workflows/archive-1405.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v7
        with:
          name: rooznama-1405-curated-json
          path: data/years/1405.json
          retention-days: 2
